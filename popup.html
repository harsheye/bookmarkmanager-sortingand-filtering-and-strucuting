<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Bookmark Organizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Ambient background glow blobs -->
  <div class="popup-glow blob-1"></div>
  <div class="popup-glow blob-2"></div>

  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="logo-group">
        <svg class="logo-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span class="logo-text">Bookmark Organizer</span>
      </div>
    </div>

    <!-- Stats Panel -->
    <div class="stat-card">
      <div class="stat-glow"></div>
      <span class="stat-val" id="total-bookmarks">-</span>
      <span class="stat-lbl">Total Bookmarks</span>
    </div>

    <!-- Actions Panel -->
    <div class="actions">
      <button id="open-command-center-btn" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"/><line x1="6" y1="8" x2="6" y2="8"/><line x1="10" y1="8" x2="10" y2="8"/><line x1="14" y1="8" x2="14" y2="8"/><line x1="18" y1="8" x2="18" y2="8"/><line x1="6" y1="12" x2="6" y2="12"/><line x1="10" y1="12" x2="10" y2="12"/><line x1="14" y1="12" x2="14" y2="12"/><line x1="18" y1="12" x2="18" y2="12"/><line x1="7" y1="16" x2="17" y2="16"/></svg>
        <span>Open Command Center</span>
      </button>
      
      <button id="open-dashboard-btn" class="btn btn-secondary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2.5 3-2.5 3h20c0 0-1-1.74-2.5-3M12 2v10M9 5l3-3 3 3M9 12h6"/></svg>
        <span>Open Sorter Dashboard</span>
      </button>
      
      <button id="autofill-form-btn" class="btn btn-secondary" style="background: linear-gradient(135deg, #10b981, #059669); border: none; color: white;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        <span>Autofill Active Form</span>
      </button>
      
      <button id="quick-restore-btn" class="btn btn-danger hidden">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><polyline points="3 3 3 8 8 8"/></svg>
        <span>Undo Last Sorting</span>
      </button>
      
      <!-- Sound Boost Panel -->
      <div class="sound-boost-container">
        <div class="sound-boost-header">
          <div class="sound-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            <span>Sound Boost</span>
          </div>
          <span id="sound-boost-val">100%</span>
        </div>
        <div class="sound-boost-segment">
          <button id="sound-down-btn" class="sound-segment-btn">-25%</button>
          <button id="sound-reset-btn" class="sound-segment-btn">Reset</button>
          <button id="sound-up-btn" class="sound-segment-btn">+25%</button>
        </div>
      </div>
      
      <!-- Feature Toggles -->
      <div class="sound-boost-container" style="margin-top: 10px;">
        <div class="sound-boost-header" style="justify-content: space-between;">
          <div class="sound-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.5" ry="2.5"></rect><line x1="12" y1="2" x2="12" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line></svg>
            <span>Video Screenshots</span>
          </div>
          <label style="display:flex; align-items:center; cursor:pointer;">
            <input type="checkbox" id="toggle-video-screenshot" style="accent-color: #8b5cf6; width: 16px; height: 16px; cursor: pointer;">
          </label>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="popup-footer">
      <span>100% Local & Secure &bull; Alt+A</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
